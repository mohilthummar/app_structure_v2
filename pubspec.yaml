name: app_structure
description: "Project structure for Flutter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1

  # Network
  dio: ^5.9.0
  http_parser: ^4.1.2
  connectivity_plus: ^7.0.0
  pretty_dio_logger: ^1.4.0

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Utils
  intl: ^0.20.2
  crypto: ^3.0.6
  shimmer: ^3.0.0
  animations: ^2.0.11
  fluttertoast: ^9.1.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.1
  pin_code_fields: ^8.0.1
  cupertino_icons: ^1.0.8
  dropdown_button2: ^2.3.9
  device_info_plus: ^12.0.0
  cached_network_image: ^3.4.1
  package_info_plus: ^9.0.0

  # Image / File pickers
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  image_cropper: ^10.0.0

  # Deep links (iOS Universal Links + Android App Links)
  app_links: ^6.3.2

  # File path utilities (used by FileDownloadService for safe path joins)
  path: ^1.9.0

  # Firebase
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  firebase_analytics: ^12.0.1
  flutter_local_notifications: ^19.4.1
  flutter_dotenv: ^6.0.0

  # Secure key/value storage (auth + refresh + CSRF tokens)
  flutter_secure_storage: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Test mocking — no codegen, simpler than mockito for the skeleton.
  mocktail: ^1.0.4

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/i18n/
    # - assets/json/
    # - assets/lottie/
    # - assets/video/
    # - assets/audio/
    # - assets/pdf/
    # - assets/excel/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Medium.ttf
        - asset: assets/fonts/OpenSans-SemiBold.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
